<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Section 3: Role Playing Game JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Passero+One&display=swap"
      rel="stylesheet"
    />
    <link href="finish.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <section class="flex flex col justify-center items-center mt-4">
      <div class="flex flex-col justify-center items-center">
        <h1 class="text-5xl underline">Role Playing Game</h1>
            
        <div id="game" class="text-white mt-4" >
          <h2 class="text-4xl my-4">Lets Go..!</h2>
         
          <!-- step 13 -->
          <div id="stats" class=" text-white text-2xl font-mono">
            <span class="stat">XP: <strong><span id="xpText">0</span></strong></span>
            <span class="stat">Health: <strong><span id="healthText">100</span></strong></span>
            <span class="stat">Gold: <strong><span id="goldText">50<span></strong><span>
         </div>
        
        <!-- step 14 -->
        <div id="controls" class="my-8 flex gap-8">
            <button id="button1" class="hover:scale-105">Go back home</button>
            <button id="button2" class="hover:scale-105" >Go to Dojo</button>
            <button id="button3" class="hover:scale-105">Fight LaRusso</button>
        </div>
      </div>
   
      <div id="monsterStats"></div>
      <div id="text"></div>

      <iframe
        src="https://giphy.com/embed/QadP1JvgEkqfm1aRXF"
        width="480"
        class="rounded-3xl mx-auto"
        height="480"
        frameborder="0"
        class="giphy-embed"
        allowfullscreen
      ></iframe>
      <p>
        <a
          href="https://giphy.com/gifs/netflix-cobra-kai-on-netflix-QadP1JvgEkqfm1aRXF"
          >via GIPHY</a
        >
      </p>
    </div>
    <script src="finishHim.js"></script>
  </body>
</html>
