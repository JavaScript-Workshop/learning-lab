<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RGB - Mosquito Repeller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Passero+One&display=swap"
      rel="stylesheet"
    />
    <link href="mosquitoStyles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <section class="flex flex col justify-center items-center mt-10">
      <h1 class="text-4xl">Role Playing Game</h1>
    </section>
    <div id="game" class="flex flex-col justify-center items-center mt-10">
      <h2 class="text-3xl">Lets Go..!</h2>
      <div id="stats" class="mt-10 text-white text-2xl font-mono">
        <span class="stat">XP: 0</span>
        <span class="stat">Health: 100</span>
        <span class="stat">Gold: 50</span>
      </div>
      <div id="controls"></div>
      <div id="monsterStats"></div>
      <div id="text"></div>
      <iframe
        src="https://giphy.com/embed/QadP1JvgEkqfm1aRXF"
        width="480"
        class="mt-8 rounded-3xl"
        height="480"
        frameborder="0"
        class="giphy-embed"
        allowfullscreen
      ></iframe>
      <p>
        <a
          href="https://giphy.com/gifs/netflix-cobra-kai-on-netflix-QadP1JvgEkqfm1aRXF"
          >via GIPHY</a
        >
      </p>
    </div>
    <script src="mosquitoJS.js"></script>
  </body>
</html>
